version: '3.4'
services:
  k6:
    image: grafana/k6:latest@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603
    command: run /services/encounter/k6_encounter.js
    volumes:
      - ../../services/encounter:/services/encounter
      - ../../inc:/inc
    environment: 
      - "HG_URL=${HG_URL}"
      - "HG_TYPE=${HG_TYPE}"
      - "HG_ENV=${HG_ENV}"
      - "HG_VUS=${HG_VUS}"
      - "HG_KEY=${HG_KEY}"
      - "HG_PASSWORD=${HG_PASSWORD}"
