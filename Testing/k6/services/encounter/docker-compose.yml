version: '3.4'
services:
  k6:
    image: grafana/k6:latest@sha256:3e4186aea62e11a45560bfc51e19eeafe82fc07ce069c78aff44b7ff893d9a5e
    command: run /services/encounter/k6_encounter.js
    volumes:
      - ../../services/encounter:/services/encounter
      - ../../inc:/inc
    environment: 
      - "HG_URL=${HG_URL}"
      - "HG_TYPE=${HG_TYPE}"
      - "HG_ENV=${HG_ENV}"
      - "HG_VUS=${HG_VUS}"
      - "HG_KEY=${HG_KEY}"
      - "HG_PASSWORD=${HG_PASSWORD}"
