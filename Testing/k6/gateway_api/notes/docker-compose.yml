version: '3.4'
services:
  k6:
    image: grafana/k6:latest@sha256:3d8e5c7f1d53ec59408c2ffbd9943602a0985ffcbd4a2430ec00f3ffca89796e
    command: run /gateway_api/notes/k6_notes.js
    volumes:
      - ../../gateway_api/notes:/gateway_api/notes
      - ../../inc:/inc
    environment:
      - "HG_URL=${HG_URL}"
      - "HG_TYPE=${HG_TYPE}"
      - "HG_ENV=${HG_ENV}"
      - "HG_VUS=${HG_VUS}"
      - "HG_KEY=${HG_KEY}"
      - "HG_PASSWORD=${HG_PASSWORD}"
