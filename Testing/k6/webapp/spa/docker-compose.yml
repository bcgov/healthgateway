version: '3.4'
services:
  k6:
    image: grafana/k6:latest@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603
    command: run /webapp/spa/k6_spa.js
    volumes:
      - ../../webapp/spa:/webapp/spa
      - ../../inc:/inc
    environment: 
      - "HG_URL=${HG_URL}"
      - "HG_ENV=${HG_ENV}"
      - "HG_KEY=${HG_KEY}"
      - "HG_VUS=${HG_VUS}"
      - "HG_TYPE=${HG_TYPE}"
      - "HG_PASSWORD=${HG_PASSWORD}"

