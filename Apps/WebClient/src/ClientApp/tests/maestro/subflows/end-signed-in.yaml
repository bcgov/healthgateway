# Ends a signed-in flow where the next one starts (owner, 2026-11-05: the app isn't relaunched between flows): Home by
# the app's own link, which works whether the tabs are a bottom bar or the iPhone Duo's side rail and from pages opened
# from Home, and checked. Close any menu or dialog the flow opened before this.
appId: hg.local
---
- runFlow:
      file: open-link.yaml
      env:
          LINK: healthgateway://home
# Home keeps its scroll position when the link opens it again: scroll up until "Add Quick Link" (at the top) shows. When
# it already shows, nothing scrolls.
- scrollUntilVisible:
      element:
          id: "add-quick-link-button"
      direction: UP
      speed: 80
      timeout: 10000
