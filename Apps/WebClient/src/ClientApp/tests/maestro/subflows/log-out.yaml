# From any signed-in page: account menu → Log Out, skipping the rating dialog if it asks, back to the landing page.
appId: hg.local
---
# the account menu is the platform's own (UIMenu / Material menu): its entries are found by their text
- tapOn: "Settings"
- extendedWaitUntil:
      visible: "Log Out"
      timeout: 5000
- tapOn: "Log Out"
- extendedWaitUntil:
      visible:
          id: "ratingModalSkipBtn"
      timeout: 8000
      optional: true
- tapOn:
      id: "ratingModalSkipBtn"
      optional: true
- extendedWaitUntil:
      visible:
          id: "btnLogin"
      timeout: 60000
