# Opens one of the app's links (env LINK, e.g. healthgateway://home). iOS 18 and earlier ask "Open in “Health Gateway
# Dev”?" every time; iOS 26 and later open the link straight away. scripts/maestro-all.sh passes HG_LINK_PROMPT=true for
# a simulator that asks, so the answer costs nothing where there is no question to answer.
appId: hg.local
---
- openLink: ${LINK}
- runFlow:
      when:
          true: ${typeof HG_LINK_PROMPT !== 'undefined' && HG_LINK_PROMPT === 'true'}
      commands:
          - tapOn:
                text: "Open"
                optional: true
