# Profile from the account menu, and the logo back to Home.
appId: hg.local
tags:
    - signedIn
---
- runFlow: ../subflows/start-signed-in.yaml
# the account menu is the platform's own (UIMenu / Material menu): its entries are found by their text
- tapOn: "Account menu"
- extendedWaitUntil:
      visible: "Profile"
      timeout: 5000
- tapOn: "Profile"
- extendedWaitUntil:
      visible: "Personal Information"
      timeout: 15000
- tapOn: "Go to Health Gateway home page"
- extendedWaitUntil:
      visible:
          id: "add-quick-link-button"
      timeout: 8000
# end where the next flow starts, and check it
- runFlow: ../subflows/end-signed-in.yaml
