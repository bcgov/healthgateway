# Profile from the account menu. Profile has no logo or account menu (Back is the way out): end-signed-in goes Home by
# the app's own link.
appId: hg.local
tags:
    - signedIn
---
- runFlow: ../subflows/start-signed-in.yaml
# the account menu is the platform's own (UIMenu / Material menu): its entries are found by their text
- tapOn: "Account menu"
- extendedWaitUntil:
      visible: "Profile"
      timeout: 5000
- tapOn: "Profile"
- extendedWaitUntil:
      visible: "Personal Information"
      timeout: 15000
# end where the next flow starts, and check it
- runFlow: ../subflows/end-signed-in.yaml
