# Feedback: the dialog opens from the account menu and closes. Sends nothing.
appId: hg.local
tags:
    - signedIn
---
- runFlow: ../subflows/start-signed-in.yaml
# the account menu is the platform's own (UIMenu / Material menu): its entries are found by their text
- tapOn: "Settings"
- extendedWaitUntil:
      visible: "Feedback"
      timeout: 5000
- tapOn: "Feedback"
- extendedWaitUntil:
      visible:
          id: "feedback-no-need-btn"
      timeout: 8000
- tapOn:
      id: "feedback-no-need-btn"
# end where the next flow starts, and check it
- runFlow: ../subflows/end-signed-in.yaml
