# The settings menu when logged out: Dark Mode and Support, and no Log in button in the header.
appId: hg.local
tags:
    - signedOut
---
- runFlow: ../subflows/start-signed-out.yaml
- assertNotVisible:
      id: "loginBtn"
# the settings menu is the platform's own (UIMenu / Material menu): its entries are found by their text
- tapOn: "Settings"
- extendedWaitUntil:
      visible: "Dark Mode"
      timeout: 5000
- assertVisible: "Support"
- tapOn: "Dark Mode"
- extendedWaitUntil:
      visible: "System"
      timeout: 5000
# Off is the default: picking it again changes nothing and closes the menu
- tapOn: "Off"
- extendedWaitUntil:
      notVisible: "Dark Mode"
      timeout: 5000
# end where the next flow starts, and check it
- runFlow: ../subflows/end-signed-out.yaml
