# Dark Mode On, then back to Off, the default.
appId: hg.local
tags:
    - signedOut
---
- runFlow: ../subflows/start-signed-out.yaml
# the settings menu is the platform's own (UIMenu / Material menu): its entries are found by their text; picking a
# choice closes it
- tapOn: "Settings"
- extendedWaitUntil:
      visible: "Dark Mode"
      timeout: 5000
- tapOn: "Dark Mode"
- extendedWaitUntil:
      visible: "On"
      timeout: 5000
- tapOn: "On"
- extendedWaitUntil:
      notVisible: "Dark Mode"
      timeout: 5000
- takeScreenshot: tests/maestro/out/dark-mode-on
- tapOn: "Settings"
- extendedWaitUntil:
      visible: "Dark Mode"
      timeout: 5000
- tapOn: "Dark Mode"
- extendedWaitUntil:
      visible: "Off"
      timeout: 5000
- tapOn: "Off"
- extendedWaitUntil:
      notVisible: "Dark Mode"
      timeout: 5000
# end where the next flow starts, and check it
- runFlow: ../subflows/end-signed-out.yaml
