name: $(Date:yyyyMMdd)$(Rev:.r) # Until the "Set app version" step names the run major.minor.build[-custom]

# The app version: major.minor from here, the build from a pipeline counter (Build/hg.yaml). Changing a value here (or
# for one run, in Run pipeline) needs no other change. BuildSeed only ever goes up: set it to the next build number the
# stores will accept (above the highest iOS and Android upload) and the count continues from there.
parameters:
  - name: VersionMajor
    type: number
    default: 2
  - name: VersionMinor
    type: number
    default: 0
  - name: BuildSeed
    type: number
    default: 0

pr: none

resources:
  pipelines:
    - pipeline: Common
      source: Common
      trigger:
        branches:
          - dev

trigger:
  batch: true
  branches:
    include:
      - dev
  paths:
    include:
      - Apps/WebClient

extends:
  template: /Build/hg.yaml
  parameters:
    Application: WebClient
    DotNetTests: true
    NPMInstall: true
    SetAppVersion: true
    VersionMajor: ${{ parameters.VersionMajor }}
    VersionMinor: ${{ parameters.VersionMinor }}
    BuildSeed: ${{ parameters.BuildSeed }}
