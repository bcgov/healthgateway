# Each overlay prefixes the name with the environment: Kong reaches it as
# <env>-mobileenvironment-svc.<licence plate>-<env>.svc:8080 (Tools/Kong/environment.tmpl).
apiVersion: v1
kind: Service
metadata:
  name: mobileenvironment-svc
  labels:
    app.kubernetes.io/name: mobile-environment
    app.kubernetes.io/part-of: healthgateway
    name: mobile-environment
spec:
  selector:
    name: mobile-environment
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
