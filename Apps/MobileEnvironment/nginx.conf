# Serves /api/mobileservice/environment (written by released-build.sh) to Kong, and /health to the probes. Everything
# writable is under /tmp: OpenShift runs the container as a random non-root user on a read-only root filesystem.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    server {
        listen 8080;
        server_name _;

        # The same path as on the gateway: Kong passes it through unchanged (strip_path: false).
        location = /api/mobileservice/environment {
            limit_except GET {
                deny all;
            }
            root /tmp;
            # application/json, from the .json extension
            try_files /environment.json =503;
            add_header Cache-Control "public, max-age=60" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            return 404;
        }
    }
}
