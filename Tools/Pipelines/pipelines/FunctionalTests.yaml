name: $(date:yyyy).$(date:MM).$(date:dd).$(rev:r)

pr: none
trigger: none

parameters:
  - name: appType
    displayName: "Application"
    type: string
    values:
      - WebClient
      - Admin
      - Both
    default: WebClient

# Build variables
variables:
  - group: Cypress
  - group: Azure DB - Dev
  - group: Admin - Dev
  - group: Phsa - Dev
  - name: WebClient
    value: ${{ or(eq(parameters.appType, 'WebClient'), eq(parameters.appType, 'Both')) }}
  - name: Admin
    value: ${{ or(eq(parameters.appType, 'Admin'), eq(parameters.appType, 'Both')) }}

jobs:
  # Resolve latest once so every worker uses the same image during this run.
  - job: "Resolve_Cypress_Image"
    displayName: "Resolve Cypress browser image"
    pool:
      vmImage: "ubuntu-latest"
    timeoutInMinutes: 5
    steps:
      - checkout: none
      - task: Bash@3
        name: resolveImage
        displayName: "Resolve current Linux AMD64 image digest"
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            digest=$(curl --fail --silent --show-error --retry 3 \
              --connect-timeout 15 --max-time 60 \
              'https://hub.docker.com/v2/repositories/cypress/browsers/tags/latest' | \
              jq -er '[.images[] | select(.os == "linux" and .architecture == "amd64") | .digest] | unique | if length == 1 then .[0] else error("Expected one Linux AMD64 image digest") end')

            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "##vso[task.logissue type=error]Invalid Cypress image digest."
              exit 1
            fi

            image="cypress/browsers@$digest"
            echo "Cypress image for this run: $image"
            echo "##vso[task.setvariable variable=image;isOutput=true]$image"

  - job: "Admin_Seed"
    displayName: "Re-seed DB and PHSA data for Admin"
    pool:
      name: "HGGoldDev"
    condition: eq(variables['Admin'], true)
    timeoutInMinutes: 5
    steps:
      - task: Bash@3
        displayName: "Re-seed DB and PHSA data for Admin"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_seedDb.sh"
          arguments: Testing/functional/tests
        env: # Required secrets for seed db script
          DB_PASSWORD: $(db.password)
          ADMIN_KEYCLOAK_SECRET: $(admin.keycloak.secret)
          PHSA_KEYCLOAK_DEVTOOLS_SECRET: $(phsa.keycloak.devtools.secret)
          REDIS_PASSWORD: $(redis.pw)
          REDIS_ENV: $(redis.env)
  - job: "Admin_Unauthorized_Tests"
    displayName: "Admin Unauthorized Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded(), eq(variables['Admin'], true))
    dependsOn:
      - "Resolve_Cypress_Image"
      - "Admin_Seed"
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Cache npm (Admin Unauthorized Functional)
        inputs:
          key: 'npm | "$(Agent.OS)" | Apps/Admin/Tests/Functional/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
      - task: Bash@3
        displayName: "Run Admin Unauthorized Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_runAdminUnauthorizedFunctionalTests.sh"
          arguments: Apps/Admin/Tests/Functional $(Build.BuildNumber)-$(System.JobAttempt) "dev,$(Build.Reason)"
        env: # Required environment settings and secrets for admin tests
          TERM: xterm
          CYPRESS_ADMIN_KEY: $(cypress.admin.key)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          KEYCLOAK_ADMIN_SECRET: $(keycloak.admin.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm
  - job: "Admin_Authentication_Tests"
    displayName: "Admin Authentication Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded('Admin_Seed'), eq(variables['Admin'], true))
    dependsOn:
      - "Resolve_Cypress_Image"
      - "Admin_Seed"
      - "Admin_Unauthorized_Tests"
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Cache npm (Admin Authentication Functional)
        inputs:
          key: 'npm | "$(Agent.OS)" | Apps/Admin/Tests/Functional/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
      - task: Bash@3
        displayName: "Run Admin Authentication Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_runAdminAuthenticationFunctionalTests.sh"
          arguments: Apps/Admin/Tests/Functional $(Build.BuildNumber)-$(System.JobAttempt) "dev,$(Build.Reason)"
        env: # Required environment settings and secrets for admin tests
          TERM: xterm
          CYPRESS_ADMIN_KEY: $(cypress.admin.key)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          KEYCLOAK_ADMIN_SECRET: $(keycloak.admin.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm
  - job: "Admin_Ui_Tests"
    displayName: "Admin Ui Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded('Admin_Seed'), eq(variables['Admin'], true))
    dependsOn:
      - "Resolve_Cypress_Image"
      - "Admin_Seed"
      - "Admin_Authentication_Tests"
    strategy:
      parallel: 2
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Cache npm (Admin Ui Functional)
        inputs:
          key: 'npm | "$(Agent.OS)" | Apps/Admin/Tests/Functional/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
      - task: Bash@3
        displayName: "Run Admin Ui Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_runAdminUiFunctionalTests.sh"
          arguments: Apps/Admin/Tests/Functional $(Build.BuildNumber)-$(System.JobAttempt) "dev,$(Build.Reason)"
        env: # Required environment settings and secrets for admin tests
          TERM: xterm
          CYPRESS_ADMIN_KEY: $(cypress.admin.key)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          KEYCLOAK_ADMIN_SECRET: $(keycloak.admin.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm

  - job: "Admin_Read_Tests"
    displayName: "Admin Read Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded('Admin_Seed'), eq(variables['Admin'], true))
    dependsOn:
      - "Resolve_Cypress_Image"
      - "Admin_Seed"
      - "Admin_Authentication_Tests"
    strategy:
      parallel: 4
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Cache npm (Admin Read Functional)
        inputs:
          key: 'npm | "$(Agent.OS)" | Apps/Admin/Tests/Functional/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
      - task: Bash@3
        displayName: "Run Admin Read Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_runAdminReadFunctionalTests.sh"
          arguments: Apps/Admin/Tests/Functional $(Build.BuildNumber)-$(System.JobAttempt) "dev,$(Build.Reason)"
        env: # Required environment settings and secrets for admin tests
          TERM: xterm
          CYPRESS_ADMIN_KEY: $(cypress.admin.key)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          KEYCLOAK_ADMIN_SECRET: $(keycloak.admin.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm

  - job: "Admin_Write_Tests"
    displayName: "Admin Write Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded('Admin_Seed'), eq(variables['Admin'], true))
    dependsOn:
      - "Resolve_Cypress_Image"
      - "Admin_Seed"
      - "Admin_Read_Tests"
    strategy:
      parallel: 4
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Cache npm (Admin Write Functional)
        inputs:
          key: 'npm | "$(Agent.OS)" | Apps/Admin/Tests/Functional/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
      - task: Bash@3
        displayName: "Run Write Admin Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_runAdminWriteFunctionalTests.sh"
          arguments: Apps/Admin/Tests/Functional $(Build.BuildNumber)-$(System.JobAttempt) "dev,$(Build.Reason)"
        env: # Required environment settings and secrets for admin tests
          TERM: xterm
          CYPRESS_ADMIN_KEY: $(cypress.admin.key)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          KEYCLOAK_ADMIN_SECRET: $(keycloak.admin.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm

  - job: "HG_Seed"
    displayName: "Re-seed DB and PHSA data for Functional Tests"
    pool:
      name: "HGGoldDev"
    condition: eq(variables['WebClient'], true)
    dependsOn: "Admin_Write_Tests"
    timeoutInMinutes: 5
    steps:
      - task: Bash@3
        displayName: "Re-seed DB and PHSA data for Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_seedDb.sh"
          arguments: Testing/functional/tests
        env: # Required secrets for seed db script
          DB_PASSWORD: $(db.password)
          ADMIN_KEYCLOAK_SECRET: $(admin.keycloak.secret)
          PHSA_KEYCLOAK_DEVTOOLS_SECRET: $(phsa.keycloak.devtools.secret)
          REDIS_PASSWORD: $(redis.pw)
          REDIS_ENV: $(redis.env)

  - job: "HG_Auth_Functional_Tests"
    displayName: "HG Auth Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded('HG_Seed'), eq(variables['WebClient'], true))
    dependsOn:
      - "Resolve_Cypress_Image"
      - "HG_Seed"
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
