          TERM: xterm
          CYPRESS_KEY: $(cypress.key)
          BCSC_PW: $(bcsc.pw)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          PHONENUMBER: $(phoneNumber)
          KEYCLOAK_EREBUS_CLIENT: $(keycloak.erebus.client)
          KEYCLOAK_EREBUS_SECRET: $(keycloak.erebus.secret)
          KEYCLOAK_PHSA_CLIENT: $(keycloak.phsa.client)
          KEYCLOAK_PHSA_SECRET: $(keycloak.phsa.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm

  - job: "HG_E2E_Functional_Tests"
    displayName: "HG E2E Functional Tests"
    pool:
      vmImage: "ubuntu-latest"
    variables:
      cypressImage: $[ dependencies.Resolve_Cypress_Image.outputs['resolveImage.image'] ]
    container:
      image: $(cypressImage)
      options: --shm-size=2g
    dependsOn:
      - "Resolve_Cypress_Image"
      - "HG_Seed"
      - "HG_UI_Functional_Tests"
    condition: and(succeeded('Resolve_Cypress_Image'), succeeded('HG_Seed'), eq(variables['WebClient'], true))
    strategy:
      parallel: 6
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: Cache@2
        displayName: Cache npm (HG E2E Functional)
        inputs:
          key: 'npm | "$(Agent.OS)" | Testing/functional/tests/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
      - task: Bash@3
        displayName: "Run HG E2E Functional Tests"
        inputs:
          targetType: filePath
          filePath: "./Tools/Pipelines/scripts/azp_runE2eFunctionalTests.sh"
          arguments: Testing/functional/tests $(Build.BuildNumber)-$(System.JobAttempt) "dev,$(Build.Reason)"
        env: # Required environment settings and secrets for HG tests
          TERM: xterm
          CYPRESS_KEY: $(cypress.key)
          BCSC_PW: $(bcsc.pw)
          KEYCLOAK_PW: $(keycloak.pw)
          IDIR_PASSWORD: $(idir.password)
          PHONENUMBER: $(phoneNumber)
          KEYCLOAK_EREBUS_CLIENT: $(keycloak.erebus.client)
          KEYCLOAK_EREBUS_SECRET: $(keycloak.erebus.secret)
          KEYCLOAK_PHSA_CLIENT: $(keycloak.phsa.client)
          KEYCLOAK_PHSA_SECRET: $(keycloak.phsa.secret)
          npm_config_cache: $(Pipeline.Workspace)/.npm
